<style>
:root {
  --background: oklch(20% 0.02 230);
  --background-deep: oklch(14% 0.018 230);
  --foreground: oklch(97% 0.005 265);
  --card: oklch(99% 0.003 265);
  --card-foreground: oklch(26% 0.03 265);
  --primary: oklch(58% 0.13 205);
  --primary-foreground: oklch(98% 0.005 205);
  --muted: oklch(94% 0.008 265);
  --muted-foreground: oklch(50% 0.018 230);
  --border: oklch(58% 0.13 205 / 0.3);
  --ring: oklch(65% 0.13 205);
  --red: oklch(58% 0.13 205);
  --red-soft: oklch(78% 0.13 205);
  --red-deep: oklch(45% 0.17 205);
  --amber: oklch(80% 0.12 60);
  --ring-gradient: conic-gradient(from 0deg, oklch(45% 0.17 205), oklch(78% 0.13 205), oklch(58% 0.13 205), oklch(78% 0.13 205), oklch(45% 0.17 205));
  --name-gradient: linear-gradient(92deg, oklch(42% 0.15 205), oklch(58% 0.13 205) 45%, oklch(75% 0.14 205) 70%, oklch(45% 0.17 205));
  --font-display: 'Outfit', sans-serif;
  --font-sans: 'Inter', sans-serif;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  width: 100%;
  min-height: 100%;
  font-family: var(--font-sans);
  background: var(--background);
  color: var(--foreground);
}

body {
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}

.landing-shell {
  background: radial-gradient(circle at 18% 12%, oklch(45% 0.12 27 / 0.2), transparent 24rem),
              radial-gradient(circle at 85% 90%, oklch(40% 0.06 265 / 0.3), transparent 26rem),
              linear-gradient(160deg, var(--background) 0%, var(--background-deep) 100%);
  place-items: center;
  min-height: 100svh;
  padding: 2rem 1rem;
  display: grid;
  position: relative;
  overflow: hidden;
}

.ambient-glow {

  pointer-events: none;
  border-radius: 50%;
  width: 30rem;
  height: 30rem;
  position: absolute;
}

.ambient-glow-top {
  background: radial-gradient(circle, oklch(55% 0.18 27 / 0.28), transparent 65%);
  animation: 11s ease-in-out infinite alternate glow-drift;
  top: -14rem;
  left: -10rem;
}

.ambient-glow-bottom {
  background: radial-gradient(circle, oklch(50% 0.16 27 / 0.26), transparent 65%);
  animation: 13s ease-in-out infinite alternate-reverse glow-drift;
  bottom: -16rem;
  right: -10rem;
}

.spark {
  background: radial-gradient(circle, var(--red-soft), transparent 70%);
  filter: blur(0.5px);
  opacity: 0;
  pointer-events: none;
  border-radius: 50%;
  width: 0.32rem;
  height: 0.32rem;
  animation: 7s ease-in-out infinite spark-float;
  position: absolute;
}

.spark-1 { animation-delay: 0s; top: 16%; left: 14%; }
.spark-2 { width: 0.24rem; height: 0.24rem; animation-delay: 2.2s; top: 28%; right: 16%; }
.spark-3 { width: 0.4rem; height: 0.4rem; animation-delay: 4.4s; bottom: 20%; left: 22%; }

.channel-card {
  z-index: 1;
  border: 1px solid var(--border);
  background: var(--card);
  width: min(100%, 22rem);
  min-height: 30rem;
  color: var(--card-foreground);
  text-align: center;
  border-radius: 2.5rem;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  padding: 2.6rem 2.2rem 2.2rem;
  animation: 0.7s cubic-bezier(0.2, 0.7, 0.2, 1) both card-enter;
  display: flex;
  position: relative;
  overflow: hidden;
  box-shadow: 0 2.5rem 5rem oklch(6% 0.02 265 / 0.55),
              0 0 0 1px oklch(78% 0.13 27 / 0.14),
              inset 0 1px oklch(100% 0 0 / 0.9);
}

.channel-card:before {
  content: "";
  border-radius: inherit;
  pointer-events: none;
  background: radial-gradient(circle at 50% 0, oklch(78% 0.13 27 / 0.16), transparent 55%);
  position: absolute;
  inset: -1px;
}

.portrait-ring {
  border-radius: 50%;
  place-items: center;
  width: 7.6rem;
  height: 7.6rem;
  display: grid;
  position: relative;
}

.portrait-ring:before {
  content: "";
  background: var(--ring-gradient);
  border-radius: 50%;
  animation: 5.5s linear infinite ring-spin;
  position: absolute;
  inset: 0;
  box-shadow: 0 0 1.6rem oklch(58% 0.22 27 / 0.45);
}

.portrait-ring:after {
  content: "";
  border: 1px solid oklch(65% 0.2 27 / 0.4);
  border-radius: 50%;
  animation: 2.6s ease-in-out infinite halo-pulse;
  position: absolute;
  inset: -0.55rem;
}

.channel-portrait {
  z-index: 1;
  object-fit: cover;
  border: 2px solid oklch(99% 0.003 265);

}

.channel-badge {

  letter-spacing: 0.15em;
  text-transform: uppercase;
  background: oklch(58% 0.22 27 / 0.1);

  border-radius: 999px;
  align-items: center;
  gap: 0.45rem;
  margin-top: 1.6rem;
  padding: 0.32rem 0.75rem;
  font-size: 0.6rem;

}

.channel-badge span {
  background: var(--red);

  height: 0.3rem;

h1 {
  max-width: 100%;
  color: var(--card-foreground);
  font-family: var(--font-display);
  letter-spacing: -0.015em;
  text-wrap: balance;

  font-size: clamp(1.8rem, 7vw, 2.3rem);
  font-weight: 900;
  line-height: 1.1;
}

h1 span {
  background: var(--name-gradient);

  background-size: 220% 100%;

  background-clip: text;
  animation: 4.5s ease-in-out infinite name-shine;
  display: inline-block;
}

.channel-description {

  margin: 1rem 0 1.6rem;
  font-size: 0.82rem;

}

.telegram-button {
  background: linear-gradient(100deg, var(--red-soft), var(--red) 55%, var(--red-deep));
  width: 100%;
  min-height: 3.2rem;

  border: 1px solid oklch(45% 0.17 27 / 0.55);

  justify-content: center;
  align-items: center;
  gap: 0.65rem;
  padding: 0.9rem 1rem;
  font-size: 0.95rem;

  position: relative;

.telegram-button:after {

  background: linear-gradient(105deg, transparent, oklch(100% 0 0 / 0.55), transparent);
  width: 55%;
  height: 100%;
  animation: 2.8s ease-in-out infinite button-shimmer;
  position: absolute;
  top: 0;
  left: -160%;
  transform: skew(-20deg);
}

.telegram-button:hover {
  filter: brightness(1.06);
  transform: translateY(-2px);
  box-shadow: 0 1.2rem 2.4rem oklch(45% 0.17 27 / 0.55);

.telegram-button:active {

}

.telegram-glyph {
  flex: none;
  width: 1.25rem;
  height: 1.25rem;
}

.telegram-sub {
  color: var(--muted-foreground);
  margin: 0.8rem 0 0;
  font-size: 0.7rem;
}

.landing-foot {
  color: var(--muted-foreground);
  opacity: 0.75;
  margin-top: 1.6rem;
  font-size: 0.62rem;
}

.reveal {
  opacity: 0;
  animation: 0.55s cubic-bezier(0.2, 0.7, 0.2, 1) forwards reveal-in;
  transform: translateY(0.9rem);
}

.d1 { animation-delay: 80ms; }
.d2 { animation-delay: 0.18s; }
.d3 { animation-delay: 0.28s; }
.d4 { animation-delay: 0.38s; }
.d5 { animation-delay: 0.48s; }
.d6 { animation-delay: 0.58s; }
.d7 { animation-delay: 0.68s; }

@keyframes glow-drift {
  0% { transform: translate(0) scale(1); }
  to { transform: translate(3.5rem, 2rem) scale(1.12); }
}

@keyframes spark-float {
  0% { opacity: 0; transform: translateY(1.2rem); }
  35% { opacity: 0.9; }
  to { opacity: 0; transform: translateY(-3rem); }
}

@keyframes card-enter {
  0% { opacity: 0; transform: translateY(1.4rem) scale(0.97); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

@keyframes reveal-in {
  to { opacity: 1; transform: translateY(0); }
}

@keyframes ring-spin {
  to { transform: rotate(360deg); }
}

@keyframes halo-pulse {
  0%, to { opacity: 0.85; transform: scale(1); }
  50% { opacity: 0.25; transform: scale(1.09); }
}

@keyframes badge-pulse {
  0%, to { opacity: 1; transform: scale(1); }
  50% { opacity: 0.5; transform: scale(1.4); }
}

@keyframes name-shine {
  0%, to { background-position: 0%; }
  50% { background-position: 100%; }
}

@keyframes button-shimmer {
  0% { left: -160%; }
  55%, to { left: 160%; }
}

    padding-inline: 1.5rem;

    padding: 1rem;
  }

  h1 span, .telegram-button:after {
    animation: none !important;
  }
  .reveal, .spark {
    opacity: 1 !important;
    transform: none !important;
  }
}
